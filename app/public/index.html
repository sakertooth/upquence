<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upquence</title>
  <link rel="stylesheet" type="text/css" href="styles/main.css">
</head>

<body>
  <div id="toast" class="toast"></div>
  <div class="toolbar">
    <div class="toolbar-main">
      <div class="toolbar-group">
        <button class="control metronome" id="metronome-button">M</button>
      </div>
      <div class="toolbar-group column">
        <input class="control slider" id="bpm-slider" type="range" min="1" max="300" />
        <button class="control bpm-display" id="bpm-display"></button>
      </div>
      <div class="toolbar-group column">
        <select class="control" id="time-signature-numerator">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
        </select>
        <select class="control" id="time-signature-denominator">
          <option>1</option>
          <option>2</option>
          <option>4</option>
          <option>8</option>
          <option>16</option>
        </select>
      </div>
      <div class="toolbar-group column">
        <button class="control" id="play-button" aria-label="Play">
          <svg id="play-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 2l11 6-11 6V2z" />
          </svg>
        </button>
        <button class="control" id="stop-button" aria-label="Stop">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <rect x="2" y="2" width="12" height="12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="toolbar-misc">
      <div class="toolbar-group column">
        <button class="control" id="download-button">Download</button>
        <input type="file" id="upload-file-input" accept=".json" hidden>
        <button class="control" id="upload-button">Upload</button>
        <button class="control" id="export-button">Export</button>
      </div>
    </div>
    <div class="toolbar-level-controls">
      <fieldset id="level-controls-fieldset">
        <legend id="level-controls-title">Level Controls</legend>
        <div class="toolbar-level-controls">
          <div class="toolbar-group column">
            <button class="control" id="play-level-button">Play</button>
            <button class="control" id="listen-to-level-button">Listen</button>
            <button class="control" id="submit-pattern-button">Submit</button>
            <button class="control" id="level-description-button">Description</button>
          </div>
        </div>
      </fieldset>
    </div>
  </div>

  <div class="game">
    <div class="sequencer-container">
      <div class="sequencer-menu" id="sequencer-menu">
        <input type="file" id="add-track-file-input" accept="audio/*" hidden>
        <button class="control" id="add-track-button">Add Track</button>
        <div class="sequencer-menu-load">
          <input class="dialog-control control" id="sequence-id-input" required>
          <button class="control" id="load-button">Load</button>
          <button class="control" id="save-button">Save</button>
        </div>
      </div>
      <div class="sequencer" id="sequencer"></div>
    </div>
  </div>

  <dialog class="dialog" id="export-dialog">
    <form>
      <div class="dialog-title">Export</div>
      <div class="dialog-settings">
        <div class="dialog-header">Format:</div>
        <select class="dialog-control control" id="format" required>
          <option value="wav">WAV</option>
        </select>
        <div class="dialog-header">Filename:</div>
        <input class="dialog-control control" id="filename" required>
      </div>
      <div class="dialog-buttons center">
        <button class="control" id="start-button" type="submit">Start</button>
        <button class="control" id="cancel-button">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog class="dialog" id="play-level-dialog">
    <form>
      <div class="dialog-title">Play Level</div>
      <div class="dialog-settings">
        <div class="dialog-header">Level:</div>
        <select class="control" id="selected-level"></select>
      </div>
      <div class="dialog-description" id="description"></div>
      <div class="dialog-buttons center">
        <button class="control" id="play-button" type="submit">Play</button>
        <button class="control" id="close-button">Close</button>
      </div>
    </form>
  </dialog>
  <dialog class="dialog" id="save-session-dialog">
    <div class="dialog-title">Your session was saved!</div>
    <span class="dialog-description center" id="sequence-id"></span>
    <div class="dialog-buttons center">
      <button class="control" id="copy-to-clipboard-button" type="submit">Copy to Clipboard</button>
      <button class="control" id="close-button">Close</button>
    </div>
  </dialog>
  <script src="http://unpkg.com/tone"></script>
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
