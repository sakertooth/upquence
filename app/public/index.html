<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upquence</title>
  <link rel="stylesheet" type="text/css" href="styles/main.css">
</head>

<body>
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="control" id="play-button" aria-label="Play">
        <svg id="play-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3 2l11 6-11 6V2z" />
        </svg>
      </button>
      <button class="control" id="stop-button" aria-label="Stop">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <rect x="2" y="2" width="12" height="12" />
        </svg>
      </button>
    </div>

    <div class="toolbar-group">
      <div class="control">
        <select class="control" id="time-signature-numerator">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
        </select>
        <select class="control" id="time-signature-denominator">
          <option>1</option>
          <option>2</option>
          <option>4</option>
          <option>8</option>
          <option>16</option>
          <option>32</option>
        </select>
      </div>
    </div>

    <div class="toolbar-group">
      <div class="bpm-display" id="bpm"></div>
    </div>

    <div class="toolbar-group">
      <button class="control metronome" id="metronome-button">M</button>
    </div>

    <div class="toolbar-group">
      <button class="control" id="export-button">Export</button>
    </div>

  </div>
  <div class="game">
    <div class="sequencer" id="sequencer"></div>
  </div>

  <dialog class="dialog" id="export-dialog">
    <div class="dialog-title">Export</div>
    <label class="dialog-group">
      Format:
      <select class="control" id="export-format">
        <option value="wav">WAV</option>
        <option value="mp3">MP3</option>
      </select>
    </label>

    <label class="dialog-group">
      Filename:
      <input class="control" id="export-filename">
    </label>

    <div class="dialog-group center">
      <button class="control" id="export-start-button">Start</button>
      <button class="control" id="export-cancel-button">Cancel</button>
    </div>

  </dialog>

  <script src="http://unpkg.com/tone"></script>
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
