<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upquence</title>
  <link rel="stylesheet" type="text/css" href="styles/main.css">
  <link rel="stylesheet" type="text/css" href="styles/sequencer.css">
  <link rel="stylesheet" type="text/css" href="styles/toolbar.css">
</head>

<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <!-- Play/Stop Buttons -->
    <div class="toolbar-group">
      <button id="play-button" class="btn btn-primary" aria-label="Play">
        <svg id="play-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3 2l11 6-11 6V2z" />
        </svg>
      </button>
      <button id="stop-button" class="btn" aria-label="Stop">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <rect x="2" y="2" width="12" height="12" />
        </svg>
      </button>
    </div>
    <!-- Time Signature Display -->
    <div class="time-signature">
        <div class="time-signature-display">
          <span id = "top-fraction" class="numerator"> </span>
          <span id = "bottom-fraction" class="denominator"></span>
        </div>
        <div class="time-signature-slider-display">
          <input
            type="range"
            id="numeratorSlider"
            min="1"
            max="64"
            value="0"
            step="1"
          >
          <input
            type="range"
            id="denominatorSlider"
            min="1"
            max="64"
            value="0"
            step="1"
          >
        </div>
    </div>
    <!-- BPM Display-->
    <div class="bpm-display" id="bpm"> </div>
    <!-- Metronome Button -->
    <button class="metronome" id="metronome-button">M</button>

  </div>

  <!-- Game Container -->
  <div class="game">
    <!-- Sequencer-->
    <div class="sequencer" id="sequencer"></div>
  </div>

  <script src="http://unpkg.com/tone"></script>
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
