# fly.toml app configuration file generated for upquence on 2026-08-20T21:51:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'upquence'
primary_region = 'ams'

[deploy]
  release_command = 'npm run start && npm run setup'
  strategy = 'rolling'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
